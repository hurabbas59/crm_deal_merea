<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipeline · Immobilien-Investment</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
  :root{
    --bg:#F5F5F7;
    --surface:#FFFFFF;
    --border:#E5E5EA;
    --border-strong:#D2D2D7;
    --text:#1D1D1F;
    --text-muted:#6E6E73;
    --text-faint:#8E8E93;
    --primary:#0071E3;
    --primary-hover:#0077ED;
    --primary-soft:#E8F1FD;
    --input-accent:#155EFF;
    --input-fill:#EFF3FA;
    --input-fill-hover:#E3EAF6;
    --accent-2:#30B0C7;
    --gradient: #0071E3;
    --gradient-soft: #E8F1FD;
    --sidebar-bg:rgba(246,246,248,0.85);
    --danger:#FF3B30;
    --danger-soft:#FFEEEE;
    --ok:#34C759;
    --ok-soft:#E9FBEF;
    --warn:#FF9500;
    --warn-soft:#FFF4E5;
    --radius-sm:10px;
    --radius:14px;
    --radius-lg:18px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 16px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
    --shadow-lg: 0 20px 50px rgba(0,0,0,0.14), 0 4px 14px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.47;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  .num, .tnum{font-variant-numeric: tabular-nums;}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#c7c7cc; border-radius:8px;}
  a{color:var(--primary);}

  svg.icon{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  /* ---------------- APP SHELL ---------------- */
  #app{display:grid; grid-template-columns:220px 1fr; min-height:100vh;}

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    background:var(--bg);
    border-right:1px solid var(--border);
    padding:22px 18px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto; align-self:start;
  }
  .sidebar-logo{display:flex; align-items:center; gap:9px; padding:0 2px 14px;}
  .logo-mark{flex-shrink:0;}
  .sidebar-logo-word{line-height:1.05;}
  .sidebar-logo-word b{font-size:13.5px; font-weight:800; letter-spacing:0.02em; color:var(--text);}
  .sidebar-logo-word span{font-size:11px; font-weight:500; letter-spacing:0.05em; color:var(--text-faint); margin-left:2px;}
  .sidebar-eyebrow{font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#C9852E; padding:0 2px 22px; border-bottom:1px solid var(--border); margin-bottom:16px;}

  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 22px;}
  .brand-text b{font-size:14.5px; font-weight:700; letter-spacing:-0.01em; display:block;}
  .brand-text span{font-size:11px; color:var(--text-faint);}

  .nav{display:flex; flex-direction:column; gap:1px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:8px 6px; border-radius:7px; cursor:pointer;
    color:#8A8A93; font-size:13.5px; font-weight:500;
    background:transparent; border:none; text-align:left; width:100%;
  }
  .nav-item svg{stroke:#B0B0B8;}
  .nav-item:hover{color:var(--text);}
  .nav-item:hover svg{stroke:var(--text);}
  .nav-item.active{background:transparent; color:var(--text); font-weight:700;}
  .nav-item.active svg{stroke:var(--text);}
  .nav-item .count{margin-left:auto; font-size:11px; color:var(--text-faint); font-weight:600;}
  .nav-item.active .count{color:var(--text-muted);}

  .btn-new{
    margin:16px 0 18px;
    background:var(--text); color:#fff; border:none; border-radius:980px;
    padding:9px 16px; font-weight:600; font-size:13.5px; cursor:pointer;
    display:flex; align-items:center; gap:8px; justify-content:center;
    transition:filter 0.15s ease;
  }
  .btn-new:hover{filter:brightness(1.3);}
  .btn-new svg{stroke:#fff; width:16px; height:16px;}

  .sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}

  .excel-box{margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
  .excel-box-title{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:6px;}
  .excel-box-status{font-size:11.5px; color:var(--text-muted); margin-bottom:8px; line-height:1.4; word-break:break-word;}
  .excel-box-status.linked{color:var(--ok); font-weight:600;}
  .excel-box-actions{display:flex; flex-direction:column; gap:6px;}
  .excel-box-actions button, .excel-box-actions label{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:7px 10px;
    font-size:11.5px; font-weight:600; color:#3F4350; cursor:pointer; text-align:center;
  }
  .excel-box-actions button:hover, .excel-box-actions label:hover{border-color:var(--border-strong);}
  .excel-box-actions button.primary-ish{background:var(--primary); border-color:var(--primary); color:#fff;}
  .sidebar-footer p{margin:0; font-size:11.5px; color:var(--text-faint); line-height:1.5;}

  .sidebar-section{margin-top:18px; padding-top:14px; border-top:1px solid var(--border); overflow-y:auto;}
  .sidebar-section-title{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); padding:0 10px 8px;}
  .recent-item{
    display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:8px; cursor:pointer;
    font-size:12.5px; color:#3F4350; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .recent-item:hover{background:#F2F3F6;}
  .recent-item .ri-icon{width:22px; height:22px; border-radius:6px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex-shrink:0;}
  .recent-item .ri-icon svg{width:12px; height:12px;}
  .recent-item span.ri-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ---------------- MAIN ---------------- */
  .main{padding:26px 34px 60px; max-width:1500px;}
  .view-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:20px; flex-wrap:wrap;}
  .view-header h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-0.02em;}
  .view-header p.sub{margin:4px 0 0; color:var(--text-muted); font-size:13px;}
  .view-header.plain{padding-bottom:20px; border-bottom:1px solid var(--border); margin-bottom:22px;}

  /* ---------------- FLAT LIST (Kontakte etc.) ---------------- */
  .flat-list{display:flex; flex-direction:column;}
  .flat-list-row{display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid #F0F0F2; cursor:pointer;}
  .flat-list-row:last-child{border-bottom:none;}
  .flat-list-row:hover{background:#FAFAFB;}
  .flat-avatar{width:36px; height:36px; border-radius:50%; background:#EFEFF1; color:#8A8A93; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .flat-row-main{flex:1; min-width:0;}
  .flat-row-name{font-size:13.5px; font-weight:700; color:var(--text);}
  .flat-row-sub{font-size:12.5px; color:#5B7FA6; margin-top:1px;}
  .flat-row-deals{font-size:12.5px; color:var(--text-faint); width:70px; text-align:right; flex-shrink:0;}
  .role-pill{font-size:11px; font-weight:600; padding:4px 12px; border-radius:20px; flex-shrink:0; min-width:76px; text-align:center;}
  .role-pill.role-Eigentümer{background:#F4F4F5; color:#C4C4CC;}
  .role-pill.role-Makler{background:#E6F7ED; color:#1E9E56;}
  .role-pill.role-Notar{background:#FFFFFF; color:#6B6B7D; border:1px solid var(--border);}
  .role-pill.role-Sonstige{background:#F0F0F2; color:#8A8A93;}

  /* ---------------- TOOLBAR ---------------- */
  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:8px 12px; min-width:240px; flex:1; max-width:340px;
  }
  .search-box svg{color:var(--text-faint);}
  .search-box input{border:none; outline:none; flex:1; background:transparent; font-size:13.5px;}
  .filter-select{
    background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 12px;
    font-size:12.5px; font-weight:500; color:#3F4350; cursor:pointer;
  }
  tr.row-done td{opacity:0.55;}
  .tb-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:8px 12px; font-size:13px; font-weight:500; color:#3F4350; position:relative;
  }
  .tb-btn:hover{border-color:var(--border-strong);}
  .tb-btn.active-filter{border-color:var(--primary); color:var(--primary); background:var(--primary-soft);}
  .tb-btn svg{width:15px; height:15px;}
  .tb-badge{background:var(--primary); color:#fff; font-size:10px; font-weight:700; border-radius:20px; padding:1px 6px; margin-left:2px;}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    border:1px solid var(--border); background:var(--surface); color:#3F4350;
    border-radius:20px; padding:7px 13px; font-size:12.5px; cursor:pointer; font-weight:500;
  }
  .chip:hover{border-color:var(--border-strong);}
  .chip.active{background:var(--text); border-color:var(--text); color:#fff;}

  .dropdown-panel{
    position:absolute; top:calc(100% + 6px); left:0; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; box-shadow:var(--shadow-lg); padding:10px; min-width:220px; z-index:50;
  }
  .dropdown-panel label{display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:13px; cursor:pointer; border-radius:6px;}
  .dropdown-panel label:hover{background:var(--bg);}
  .view-toggle{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px;}
  .view-toggle button{background:transparent; border:none; padding:6px 12px; border-radius:7px; font-size:13px; font-weight:500; color:var(--text-muted); display:flex; align-items:center; gap:6px;}
  .view-toggle button.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-sm);}

  /* ---------------- PILLS / BADGES ---------------- */
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; white-space:nowrap;}
  .pill-neu{background:#ECFDF5; color:#047857;}
  .pill-pruefung{background:#EFF6FF; color:#1D4ED8;}
  .pill-kalkulation{background:#F5F3FF; color:#6D28D9;}
  .pill-loi{background:#FFFBEB; color:#B45309;}
  .pill-dd{background:#FFF7ED; color:#C2410C;}
  .pill-notar{background:#EEF2FF; color:#4338CA;}
  .pill-abgesagt{background:#F3F4F6; color:#6B7280;}

  .type-badge{font-size:10.5px; font-weight:700; letter-spacing:0.02em; padding:3px 8px; border-radius:6px; white-space:nowrap;}
  .type-badge.pe{background:#EEF2FF; color:#4338CA;}
  .type-badge.mfh{background:#ECFDF5; color:#047857;}

  .role-badge{font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:6px; background:#F3F4F6; color:#4B5563;}

  /* ---------------- KPI CARDS ---------------- */
  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px;}
  .kpi-card{background:var(--surface); border-radius:var(--radius); padding:20px 22px; border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:box-shadow 0.15s ease;}
  .kpi-card:hover{box-shadow:var(--shadow);}
  .kpi-label{font-size:12px; color:var(--text-muted); font-weight:500; margin-bottom:12px;}
  .kpi-value{font-size:27px; font-weight:700; letter-spacing:-0.015em;}
  .kpi-value.danger{color:var(--danger);}
  .kpi-sub{font-size:12px; color:var(--text-faint); margin-top:5px;}

  .panel{background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); padding:24px 26px; margin-bottom:24px; box-shadow:var(--shadow-sm);}
  .panel h3{margin:0 0 16px; font-size:14.5px; font-weight:700; letter-spacing:-0.01em;}

  /* ---------------- FUNNEL / KONVERSIONS-CHART ---------------- */
  .funnel-top{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .funnel-title{font-size:15px; font-weight:700;}
  .funnel-icon{margin-right:2px;}
  .funnel-sub{font-size:10.5px; font-weight:700; letter-spacing:0.06em; color:var(--text-faint);}
  .funnel-headline{font-size:14px; font-weight:600; color:var(--text-muted); margin:14px 0 16px;}
  .metric-toggle{display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px; margin-bottom:24px;}
  .metric-btn{background:transparent; border:none; padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer;}
  .metric-btn.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm);}
  .funnel-chart{display:flex; align-items:flex-end; gap:4px; height:220px; padding-top:10px; overflow-x:auto;}
  .funnel-col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; flex:1; min-width:70px;}
  .funnel-value{font-size:13px; font-weight:700; margin-bottom:8px; white-space:nowrap;}
  .funnel-bar{width:56%; min-width:34px; border-radius:6px 6px 2px 2px; transition:height 0.2s ease;}
  .funnel-label{margin-top:10px; font-size:11.5px; color:var(--text-muted); text-align:center; white-space:nowrap;}
  .funnel-arrow{
    background:#3A3A3E; color:#fff; font-size:11px; font-weight:700; padding:5px 10px 5px 8px;
    clip-path:polygon(0 0, 70% 0, 100% 50%, 70% 100%, 0 100%, 14% 50%);
    margin-bottom:34px; flex-shrink:0; white-space:nowrap;
  }
  .funnel-legend{margin-top:18px; font-size:12px; color:var(--text-muted); display:flex; align-items:center;}
  .legend-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}

  .bar-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #F2F3F6;}
  .bar-row:last-child{border-bottom:none;}
  .bar-row .label{width:150px; font-size:13px; font-weight:500; flex-shrink:0;}
  .bar-track{flex:1; height:8px; background:#EFF0F3; border-radius:8px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--gradient); border-radius:8px;}
  .bar-row .count{width:130px; text-align:right; font-size:12.5px; color:var(--text-muted); flex-shrink:0;}

  .task-alert-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #F2F3F6; gap:10px;}
  .task-alert-row:last-child{border-bottom:none;}
  .task-alert-row .ttitle{font-size:13.5px;}
  .task-alert-row .ttitle b{font-weight:600; cursor:pointer;}
  .task-alert-row .ttitle b:hover{color:var(--primary);}
  .task-alert-row .tdue{font-size:12px; color:var(--danger); font-weight:600; flex-shrink:0;}

  .empty-state{padding:30px 10px; text-align:center; color:var(--text-faint); font-size:13.5px;}

  /* ---------------- TABLE (DEALS) ---------------- */
  .table-wrap{background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow-sm);}
  .table-wrap.table-wrap-plain{background:transparent; border:none; box-shadow:none; border-radius:0;}
  table.deals{width:100%; border-collapse:collapse; font-size:13px;}
  table.deals th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint);
    font-weight:700; padding:14px 16px; border-bottom:1px solid var(--border); background:#FAFAFB; cursor:pointer; user-select:none;
  }
  table.deals th:hover{color:var(--text-muted);}
  table.deals th.sorted{color:var(--primary);}
  table.deals td{padding:13px 16px; border-bottom:1px solid #F2F3F6; vertical-align:middle;}
  table.deals tbody tr{cursor:pointer; transition:background 0.12s ease;}
  table.deals tbody tr:hover{background:#FAFBFF;}
  table.deals tbody tr:last-child td{border-bottom:none;}
  .thumb{width:42px; height:42px; border-radius:10px; background:#F0F1F4; display:flex; align-items:center; justify-content:center; color:#B7BAC3; overflow:hidden; flex-shrink:0;}
  .thumb svg{width:19px; height:19px;}
  .cell-name{font-weight:600;}
  .cell-sub{font-size:12px; color:var(--text-faint); margin-top:1px;}
  .cell-name-wrap{display:flex; align-items:center; gap:12px;}
  table.deals td.chk-col, table.deals th.chk-col{width:36px; padding-right:0;}
  table.deals input[type="checkbox"]{width:15px; height:15px; accent-color:var(--primary); cursor:pointer;}

  table.compare-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.compare-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); font-weight:700; padding:2px 4px 6px;}
  table.compare-table td{padding:3px 4px; vertical-align:middle; color:var(--text-muted);}
  table.compare-table td.tnum{color:var(--text); text-align:right;}
  table.compare-table th.tnum{text-align:right;}
  table.compare-table tr.total-row td{font-weight:700; color:var(--text); padding-top:7px;}
  table.compare-table input.line-input{padding:3px 5px; text-align:right;}
  .row-actions{position:relative;}
  .row-more-btn{width:28px; height:28px; border-radius:7px; border:none; background:transparent; color:var(--text-faint); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;}
  .row-more-btn:hover{background:#F0F1F4; color:var(--text);}
  .row-menu{position:absolute; right:0; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--border); border-radius:9px; box-shadow:var(--shadow-lg); min-width:150px; z-index:60; overflow:hidden;}
  .row-menu button{display:block; width:100%; text-align:left; background:none; border:none; padding:9px 13px; font-size:12.5px; color:#3F4350;}
  .row-menu button:hover{background:var(--bg);}
  .row-menu button.danger{color:var(--danger);}
  .bulk-bar{display:flex; align-items:center; gap:12px; background:var(--text); color:#fff; border-radius:10px; padding:10px 16px; margin-bottom:14px; font-size:13px;}
  .bulk-bar button{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:7px; padding:6px 12px; font-size:12px;}
  .bulk-bar button:hover{background:rgba(255,255,255,0.2);}

  /* ---------------- KANBAN ---------------- */
  .kanban-scroll{display:flex; gap:14px; overflow-x:auto; padding-bottom:14px; align-items:flex-start;}
  .kanban-col{background:transparent; border:1px solid transparent; border-radius:var(--radius); min-width:280px; max-width:280px; flex-shrink:0; padding:12px; transition:background 0.12s ease, border-color 0.12s ease;}
  .kanban-col.absagen{opacity:0.7;}
  .kanban-col.drag-over{background:var(--primary-soft); border-color:var(--primary);}
  .kanban-col-head{display:flex; justify-content:space-between; align-items:center; padding:2px 4px 10px;}
  .kanban-col-head .colname{font-size:12.5px; font-weight:700;}
  .kanban-col-count{font-size:11.5px; color:var(--text-faint); font-weight:600; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2px 8px;}
  .kanban-col-bar{height:3px; border-radius:3px; margin:0 4px 10px;}
  .kanban-col-vol{font-size:11px; color:var(--text-faint); padding:0 4px 10px;}
  .kanban-cards{display:flex; flex-direction:column; gap:9px; min-height:60px;}

  .card{
    background:var(--surface); border-radius:13px; border:1px solid var(--border);
    padding:14px 15px; cursor:grab; box-shadow:var(--shadow-sm); transition:box-shadow 0.15s ease, transform 0.15s ease;
  }
  .card:hover{border-color:var(--border-strong); box-shadow:var(--shadow); transform:translateY(-1px);}
  .card.dragging{opacity:0.4;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:6px;}
  .card-title{font-weight:600; font-size:13px; margin:0; line-height:1.3;}
  .card-sub{font-size:11.5px; color:var(--text-faint); margin:3px 0 10px;}
  .card-meta{display:flex; justify-content:space-between; align-items:center;}
  .card-price{font-size:13px; font-weight:700;}
  .card-margin{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--ok-soft); color:var(--ok);}
  .card-margin.neg{background:var(--danger-soft); color:var(--danger);}
  .card-tasks{display:flex; align-items:center; gap:5px; margin-top:9px;}
  .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .dot.ok{background:var(--ok);}
  .dot.warn{background:var(--warn);}
  .dot.overdue{background:var(--danger);}
  .dot.none{background:#D7D9E0;}
  .card-tasks span{font-size:11px; color:var(--text-faint);}

  /* ---------------- BUTTONS ---------------- */
  .btn{border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:8px 14px; font-size:12.5px; cursor:pointer; font-weight:500; color:#3F4350; transition:all 0.12s ease;}
  .btn:hover{border-color:var(--border-strong); box-shadow:var(--shadow-sm);}
  .btn.primary{background:var(--primary); border-color:transparent; color:#fff; font-weight:600; box-shadow:none; border-radius:980px; padding:8px 18px;}
  .btn.primary:hover{background:var(--primary-hover); box-shadow:none;}
  .btn.danger-outline{color:var(--danger); border-color:#F3D2D2;}
  .btn.danger-outline:hover{background:var(--danger-soft);}
  .btn.small{padding:5px 10px; font-size:11.5px;}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.ghost:hover{background:#F2F3F6;}
  .icon-btn{width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:#3F4350; transition:all 0.12s ease;}
  .icon-btn:hover{border-color:var(--border-strong); box-shadow:var(--shadow-sm);}

  /* ---------------- MODAL (OBJECT DETAIL) ---------------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(17,20,28,0.45); z-index:1000;
    display:flex; align-items:flex-start; justify-content:center; padding:26px 20px; overflow-y:auto;
  }
  .modal{
    background:var(--bg); border-radius:16px; width:100%; max-width:1220px;
    box-shadow:var(--shadow-lg); overflow:hidden;
  }
  .modal-head{background:var(--surface); border-bottom:1px solid var(--border); padding:18px 26px;}
  .breadcrumb{font-size:12px; color:var(--text-faint); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .modal-head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
  .modal-head-left{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .thumb-lg{width:44px; height:44px; border-radius:10px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .thumb-lg svg{width:22px; height:22px;}
  .title-input{
    background:transparent; color:var(--text); font-size:18px; font-weight:700;
    padding:2px 1px; width:auto; max-width:100%;
  }
  .modal-head-actions{display:flex; align-items:center; gap:6px; padding-left:14px; margin-left:4px; border-left:1px solid var(--border);}
  select.phase-select{
    -webkit-appearance:none; appearance:none; border:none; border-radius:20px; padding:4px 26px 4px 12px; font-size:11.5px; font-weight:600; cursor:pointer;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6B7D' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 8px center; background-size:12px;
  }
  select.phase-select:focus{outline:2px solid var(--primary); outline-offset:1px;}

  .tabbar{display:flex; gap:4px; background:var(--surface); padding:0 26px; border-bottom:1px solid var(--border);}
  .tab-btn{
    background:transparent; border:none; color:var(--text-muted); padding:12px 4px; margin-right:22px; font-size:13px; font-weight:500;
    cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab-btn.active{color:var(--text); border-bottom-color:var(--primary); font-weight:600;}

  /* ---------------- OBJECT PAGE (full-page detail, no popup) ---------------- */
  .object-sticky-head{position:sticky; top:0; z-index:80; background:var(--bg); padding-top:2px; margin-top:-2px;}
  .object-header{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius) var(--radius) 0 0; padding:16px 22px 0; box-shadow:var(--shadow-sm);}
  .back-link{background:none; border:none; color:var(--text-muted); font-size:12.5px; font-weight:500; padding:0 0 12px; cursor:pointer;}
  .back-link:hover{color:var(--primary);}
  .object-header-top{display:flex; align-items:flex-start; gap:14px; padding-bottom:16px;}
  .object-subline{display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; font-size:12.5px; color:var(--text-faint);}
  .subline-faint{color:var(--text-faint); font-size:12px;}
  .page-tabbar{background:var(--surface); border:1px solid var(--border); border-top:none; padding:0 22px; margin-bottom:0;}
  .object-body{background:var(--surface); border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius) var(--radius); padding:24px 26px 30px; box-shadow:var(--shadow-sm);}

  .obj-summary{margin:18px 0 26px;}
  .obj-summary-address{font-size:20px; font-weight:700; letter-spacing:-0.015em;}
  .obj-summary-specs{font-size:13px; color:var(--text-faint); margin-top:6px;}

  .makler-box{max-width:420px; margin-bottom:26px;}
  .makler-box-row{display:flex; align-items:center; gap:12px;}
  .makler-box-avatar{width:38px; height:38px; border-radius:50%; background:var(--primary); color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .makler-box-contacts{display:flex; flex-direction:column; gap:6px; margin-top:14px; padding-top:14px; border-top:1px solid #F2F3F6;}
  .makler-box-link{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); text-decoration:none;}
  .makler-box-link:hover{color:var(--primary);}
  .makler-box-link svg{width:14px; height:14px; color:var(--text-faint); flex-shrink:0;}

  .toggle-btn{display:inline-flex; align-items:center; gap:7px;}
  .collapse-block{margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--border);}
  .collapse-block:last-of-type{border-bottom:none;}

  .keyfacts-row{display:flex; gap:0; flex-wrap:wrap; margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--border);}
  .kf-chip{background:transparent; padding:0 22px; min-width:auto;}
  .kf-chip:first-child{padding-left:0;}
  .kf-chip:not(:last-child){border-right:1px solid var(--border);}
  .kf-label{font-size:11px; color:var(--text-faint); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
  .kf-value{font-size:17px; font-weight:700; letter-spacing:-0.01em;}
  .kf-sub{font-size:11.5px; color:var(--text-faint); margin-top:3px;}

  .modal-body{padding:22px 26px; max-height:82vh; overflow-y:auto;}
  .modal-body.two-col{display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:start;}
  .two-col-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:start; margin-bottom:24px;}
  .address-map-grid{display:grid; grid-template-columns:1fr 1.4fr; gap:20px; align-items:start;}
  .annahmen-result-layout{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}

  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:13px;}
  .form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .form-grid.cols-1{grid-template-columns:1fr; max-width:420px;}

  .address-suggestions{position:absolute; left:0; right:0; top:100%; z-index:40; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-top:4px; box-shadow:var(--shadow-md, 0 6px 20px rgba(0,0,0,0.12)); max-height:260px; overflow-y:auto; display:none;}
  .address-suggestions.open{display:block;}
  .address-suggestion{padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #F2F3F6;}
  .address-suggestion:last-child{border-bottom:none;}
  .address-suggestion:hover, .address-suggestion.active{background:var(--bg);}
  .address-suggestion .as-main{font-weight:600;}
  .address-suggestion .as-sub{font-size:11.5px; color:var(--text-faint);}

  /* ---------------- CALC TABLE (Ansatz / Gesamt) ---------------- */
  .calc-table{border-radius:10px; overflow:hidden; max-width:640px;}
  .calc-table-head{display:flex; align-items:center; padding:2px 4px 6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); gap:10px;}
  .calc-table-head .cl-label, .calc-table-head .cl-ansatz, .calc-table-head .cl-gesamt{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint);}
  .calc-table-head .cl-ansatz{display:flex; justify-content:flex-end;}
  .calc-line{display:flex; align-items:center; padding:3px 4px; gap:10px;}
  .calc-line.total{font-weight:700; margin-top:4px; padding-top:7px;}
  .cl-label{flex:1; font-size:13px; min-width:0; color:var(--text-muted);}
  .calc-line.total .cl-label{color:var(--text);}
  .cl-ansatz{width:190px; flex-shrink:0; display:grid; grid-template-columns:90px 85px; justify-content:end; align-items:center; column-gap:6px;}
  .cl-ansatz input{width:85px; border:none; border-radius:4px; padding:3px 5px; text-align:right; font-size:13px; color:var(--text); background:var(--input-fill); transition:background-color .12s ease;}
  .cl-ansatz input:hover{background:var(--input-fill-hover);}
  .cl-ansatz input:focus{outline:none; background:var(--input-fill-hover);}
  .line-input{border:none; border-radius:4px; padding:3px 5px; color:var(--text); background:var(--input-fill); transition:background-color .12s ease;}
  .line-input:hover{background:var(--input-fill-hover);}
  .line-input:focus{outline:none; background:var(--input-fill-hover);}
  .cl-ansatz-static{color:var(--text-faint); font-size:12.5px; text-align:right;}
  .cl-ansatz .unit{font-size:11px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right;}
  .cl-gesamt{width:120px; flex-shrink:0; text-align:right; font-weight:600; font-size:13px;}
  .field{display:flex; flex-direction:column; gap:3px;}
  .field label{font-size:12px; font-weight:600; color:#4B5563;}
  .field label .hint{font-weight:400; color:var(--text-faint); text-transform:none; letter-spacing:0;}
  .field input, .field select, .field textarea{
    border:none; border-radius:5px; padding:6px 8px; background:var(--input-fill); color:var(--text);
    transition:background-color .12s ease;
  }
  .field input:hover, .field select:hover, .field textarea:hover{background:var(--input-fill-hover);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; background:var(--input-fill-hover);}
  .field.span-2{grid-column:span 2;}
  .field.span-3{grid-column:span 3;}

  .type-toggle{display:flex; gap:10px; margin-bottom:18px;}
  .type-toggle button{
    flex:1; border:1.5px solid var(--border); background:var(--surface); border-radius:11px; padding:14px; cursor:pointer;
    text-align:left;
  }
  .type-toggle button b{display:block; font-size:14px;}
  .type-toggle button span{font-size:12px; color:var(--text-muted);}
  .type-toggle button.selected{border-color:var(--primary); background:var(--primary-soft);}

  .section-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--text); margin:14px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--border);}
  .section-title:first-child{margin-top:0;}

  .calc-section-card{padding:0; margin-bottom:24px;}
  .calc-section-card .section-title{margin-top:0;}

  .side-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm);}
  .side-card h4{margin:0 0 14px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint);}
  .contact-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px; border-bottom:1px solid #F5F5F7;}
  .contact-row:last-of-type{border-bottom:none;}
  .contact-row .l{color:var(--text-faint);}
  .contact-row .r{font-weight:600;}

  .calc-result{background:#1D1D1F; color:#fff; border-radius:18px; padding:26px 26px 22px; border:none; box-shadow:0 8px 28px rgba(0,0,0,0.18);}
  .calc-result .eyebrow{color:#0A84FF;}
  .result-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 22px;}
  .result-stat{background:rgba(255,255,255,0.06); border-radius:12px; padding:14px 12px;}
  .result-stat .rs-label{font-size:11px; color:rgba(255,255,255,0.55); margin-bottom:6px;}
  .result-stat .rs-value{font-size:18px; font-weight:700; color:#0A84FF;}
  .result-stat.negative .rs-value{color:#FF6961;}
  .result-group-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.4); margin:0 0 6px;}
  .result-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.08); font-size:13px;}
  .result-row:last-child{border-bottom:none;}
  .result-row.total{font-weight:700; font-size:14.5px; padding-top:14px;}
  .result-row.highlight .v{color:#0A84FF; font-weight:700; font-size:16px;}
  .result-row.negative .v{color:#FF6961;}

  .eyebrow{font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--primary); margin:0 0 6px 0;}

  #map{height:min(78vh, 820px); min-height:520px; border-radius:var(--radius); border:1px solid var(--border);}
  #map.map-compact{height:440px; min-height:360px;}
  .map-compact-grid{display:grid; grid-template-columns:1fr 1.6fr; gap:16px; align-items:start;}
  .map-compact-side{display:flex; flex-direction:column; gap:16px;}
  .marker-icon-cancelled{ filter: hue-rotate(150deg) saturate(1.6); }
  .map-tools{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .map-info-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:16px;}

  .task-row, .doc-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid #F2F3F6;}
  .task-row:last-child, .doc-row:last-child{border-bottom:none;}
  .task-row .tcheck{width:17px; height:17px; flex-shrink:0; accent-color:var(--primary);}
  .task-row .ttext{flex:1;}
  .task-row .ttext .tt-main{font-size:13.5px;}
  .task-row.done .tt-main{text-decoration:line-through; color:var(--text-faint);}
  .task-row .ttext .tt-meta{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .task-row .tampel{width:9px; height:9px; border-radius:50%; flex-shrink:0;}

  .add-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .add-row input, .add-row select{flex:1; min-width:120px; border:none; border-radius:5px; padding:6px 8px; background:var(--input-fill); color:var(--text); transition:background-color .12s ease;}
  .add-row input:hover, .add-row select:hover{background:var(--input-fill-hover);}
  .add-row input:focus, .add-row select:focus{outline:none; background:var(--input-fill-hover);}

  .doc-row .doc-name{font-weight:600; font-size:13.5px;}
  .doc-row .doc-note{font-size:12px; color:var(--text-faint);}
  .doc-row a{color:var(--primary); font-size:12.5px; text-decoration:none;}
  .doc-row a:hover{text-decoration:underline;}

  .footer-actions{display:flex; justify-content:space-between; padding:15px 26px; border-top:1px solid var(--border); background:var(--surface);}

  /* ---------------- CONTACTS ---------------- */
  .linked-obj-chip{display:inline-flex; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:3px 10px; font-size:12px; margin:2px 4px 2px 0; cursor:pointer;}
  .linked-obj-chip:hover{border-color:var(--primary); color:var(--primary);}

  @media (max-width: 900px){
    #app{grid-template-columns:1fr;}
    .sidebar{flex-direction:row; overflow-x:auto;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .form-grid, .form-grid.cols-3{grid-template-columns:1fr;}
    .map-info-grid, .map-compact-grid, .modal-body.two-col, .two-col-grid, .annahmen-result-layout, .address-map-grid{grid-template-columns:1fr;}
  }
</style>
</head>

<div id="app">
  <aside class="sidebar">

    <div class="excel-box" id="excelBox">
      <div class="excel-box-title">Excel</div>

  <main class="main" id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
/* ==================== STORAGE ==================== */
const STORE_PREFIX = 'object:';
const CONTACT_PREFIX = 'contact:';


/* Persistenz: localStorage im Browser (funktioniert offline, ohne Backend).
   Zusätzlich wird bei jeder Änderung automatisch die verknüpfte Excel-Datei
   aktualisiert (siehe scheduleExcelSync/excelWriteToHandle) – so bleibt eine
   für Kolleg:innen lesbare, portable Kopie der Daten erhalten. */
async function storageList(prefix){
  const items = [];
  for(let i=0; i<localStorage.length; i++){
    const key = localStorage.key(i);
    if(!key || !key.startsWith(prefix)) continue;
    try{ const raw = localStorage.getItem(key); if(raw) items.push(JSON.parse(raw)); }
    catch(e){ console.error('storageList: Eintrag beschädigt', key, e); }
  }
  return items;
}
async function storageSave(prefix, item){
  try{
    localStorage.setItem(prefix + item.id, JSON.stringify(item));
    scheduleExcelSync();
    return true;
  }catch(e){
    console.error('storageSave failed', e);

/* Erhaelt die Cursorposition ueber ein Re-Rendering hinweg (gemessen als
   Abstand vom Stringende) -- ohne das wuerde der Cursor nach jedem
   Tastendruck an den Anfang springen, weil das Feld komplett neu erzeugt wird. */
function refocusPreservingCaret(el, distFromEnd){
  if(!el) return;
  el.focus();
  const pos = Math.max(0, el.value.length - distFromEnd);
  try{ el.setSelectionRange(pos, pos); }catch(e){}
}
function fmtDate(d){
  if(!d) return '–';

}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  const today = new Date(todayStr()+'T00:00:00');
  const due = new Date(dateStr+'T00:00:00');
  return Math.round((due-today)/(1000*60*60*24));
}
function taskStatus(task){
  if(task.done) return 'ok';
  if(!task.due) return 'none';
  const d = daysUntil(task.due);
  if(d < 0) return 'overdue';
  if(d <= 5) return 'warn';
  return 'ok';
}
function escapeHtml(s){
  if(s===null||s===undefined) return '';

}

/* ==================== CALCULATION ENGINE ==================== */
/* Projektentwicklung = Grundstücksparzellierung: Ankauf -> Parzellierung -> je Parzelle
   ein Haus bauen und Haus+Grundstücksanteil verkaufen. */
/* Migriert ältere/unvollständige calc-Objekte auf das aktuelle Schema, damit
   bereits gespeicherte Angebote nicht wegen fehlender Felder abstürzen. */
function ensureCalcShape(obj){
  if(obj.type !== 'pe') return;
  if(!obj.calc || typeof obj.calc !== 'object') obj.calc = {};
  const c = obj.calc;
  if(c.nettokaufpreis == null) c.nettokaufpreis = c.grundstueckspreis || 500000;
  if(c.grunderwerbsteuer_pct == null) c.grunderwerbsteuer_pct = GRUNDERWERBSTEUER[obj.bundesland] || 6;
  if(c.notarkosten_pct == null) c.notarkosten_pct = 1.5;
  if(c.maklerkosten_pct == null) c.maklerkosten_pct = 6;
  if(c.sonstige_erwerbsnebenkosten_pct == null) c.sonstige_erwerbsnebenkosten_pct = 0;
  if(c.kaufpreiswunsch === undefined) c.kaufpreiswunsch = null;
  if(!Array.isArray(c.baunebenkosten_items) || !c.baunebenkosten_items.length){
    const migrated = [];
    if(c.baunebenkosten_gesamt) migrated.push({id:bnkId(), label:'Baunebenkosten', mode:'pauschal', ansatz:c.baunebenkosten_gesamt});
    if(c.zufahrt_kanal_gesamt) migrated.push({id:bnkId(), label:'Zufahrt + Kanal', mode:'pauschal', ansatz:c.zufahrt_kanal_gesamt});
    if(c.abrisskosten_gesamt) migrated.push({id:bnkId(), label:'Abrisskosten', mode:'pauschal', ansatz:c.abrisskosten_gesamt});
    c.baunebenkosten_items = migrated.length ? migrated : [
      { id: bnkId(), label:'Teilung & Genehmigung', mode:'je_haus', ansatz:5000 },
      { id: bnkId(), label:'Hausanschlusskosten', mode:'je_haus', ansatz:15000 },
      { id: bnkId(), label:'Abrisskosten', mode:'pauschal', ansatz:60000 },
      { id: bnkId(), label:'Sonstiges', mode:'pauschal', ansatz:60000 },
    ];
  }
  c.baunebenkosten_items.forEach(item=>{ if(!item.id) item.id = bnkId(); if(!item.mode) item.mode = 'pauschal'; });
  delete c.baunebenkosten_gesamt; delete c.zufahrt_kanal_gesamt; delete c.abrisskosten_gesamt;
  if(c.eigenkapital_pct == null) c.eigenkapital_pct = 20;
  if(c.laufzeit_monate == null) c.laufzeit_monate = 12;
  if(c.zinssatz_pct_pa == null) c.zinssatz_pct_pa = 6;
  if(c.bearbeitungsgebuehr_pct == null) c.bearbeitungsgebuehr_pct = 0;
  if(c.vertriebskosten_pct == null) c.vertriebskosten_pct = 1.5;
  if(c.sonstige_kosten_ertrag_pct == null) c.sonstige_kosten_ertrag_pct = 0;
  if(!Array.isArray(c.parcels) || !c.parcels.length) c.parcels = [newParcel()];
  c.parcels.forEach(p=>{ if(!p.id) p.id = taskId(); });
}

function calcPE(obj){
  ensureCalcShape(obj);
  const c = obj.calc;
  const grundstuecksgroesse = obj.grundstuecksgroesse || 0;
  const parcels = (c.parcels && c.parcels.length) ? c.parcels : [newParcel()];
  const anzahlParzellen = parcels.length;

  const nettokaufpreis = c.nettokaufpreis || 0;
  const grest = nettokaufpreis * (c.grunderwerbsteuer_pct||0)/100;
  const notar = nettokaufpreis * (c.notarkosten_pct||0)/100;
  const makler = nettokaufpreis * (c.maklerkosten_pct||0)/100;
  const sonstigeErwerb = nettokaufpreis * (c.sonstige_erwerbsnebenkosten_pct||0)/100;
  const erwerbsnebenkosten = grest + notar + makler + sonstigeErwerb;
  const erwerbsnebenkosten_pct = (c.grunderwerbsteuer_pct||0)+(c.notarkosten_pct||0)+(c.maklerkosten_pct||0)+(c.sonstige_erwerbsnebenkosten_pct||0);
  const bruttokaufpreis = nettokaufpreis + erwerbsnebenkosten;
  const bruttokaufpreis_je_qm = grundstuecksgroesse > 0 ? bruttokaufpreis/grundstuecksgroesse : null;
  const bodenrichtwert_je_qm = obj.bodenrichtwert || null;
  const bodenrichtwert_gesamt = (obj.bodenrichtwert||0) * grundstuecksgroesse;
  const nettokaufpreis_je_qm = grundstuecksgroesse > 0 ? nettokaufpreis/grundstuecksgroesse : null;
  const kaufpreiswunsch_gesamt = c.kaufpreiswunsch;
  const kaufpreiswunsch_je_qm = (c.kaufpreiswunsch!=null && grundstuecksgroesse>0) ? c.kaufpreiswunsch/grundstuecksgroesse : null;
  const abwWunschAbs = (c.kaufpreiswunsch!=null) ? nettokaufpreis - c.kaufpreiswunsch : null;
  const abwWunschPct = (c.kaufpreiswunsch) ? (abwWunschAbs/c.kaufpreiswunsch*100) : null;
  const abwBrwAbs = (obj.bodenrichtwert!=null && bodenrichtwert_gesamt>0) ? nettokaufpreis - bodenrichtwert_gesamt : null;
  const abwBrwPct = (bodenrichtwert_gesamt>0) ? (abwBrwAbs/bodenrichtwert_gesamt*100) : null;

  const baunebenkostenItems = (c.baunebenkosten_items||[]).map(item=>{
    const gesamt = item.mode === 'je_haus' ? (item.ansatz||0) * anzahlParzellen : (item.ansatz||0);
    return {...item, gesamt};
  });
  const sonstigeKostenGesamt = baunebenkostenItems.reduce((s,i)=>s+i.gesamt,0);

  const grundstueckJeParzelle = anzahlParzellen>0 ? grundstuecksgroesse/anzahlParzellen : 0;
  const grundstueckskostenEkJeParzelle = anzahlParzellen>0 ? bruttokaufpreis/anzahlParzellen : 0;
  const baunebenkostenJeParzelle = anzahlParzellen>0 ? sonstigeKostenGesamt/anzahlParzellen : 0;

  let sumWohnflaeche=0, sumHauskosten=0, sumVerkaufspreisHaus=0, sumGestehungskosten=0,
      sumDeckungsbeitragGrundstueck=0, sumVerkaufspreisGrundstueck=0, sumGrundstueckQm=0;

  const parzellenErgebnis = parcels.map(p=>{
    const wohnflaeche = p.wohnflaeche || 0;
    const baukosten_pro_m2 = p.baukosten_pro_m2 || 0;
    const hauskosten = wohnflaeche * baukosten_pro_m2;
    const gestehungskosten = grundstueckskostenEkJeParzelle + hauskosten + baunebenkostenJeParzelle;
    const verkaufspreis_haus = p.verkaufspreis_haus || 0;
    const verkaufspreis_haus_je_qm = wohnflaeche > 0 ? verkaufspreis_haus/wohnflaeche : null;
    const grundstueck_qm = p.grundstueck_qm != null ? p.grundstueck_qm : grundstueckJeParzelle;
    const verkaufspreis_grundstueck = verkaufspreis_haus - hauskosten - baunebenkostenJeParzelle;
    const verkaufspreis_grundstueck_je_qm = grundstueck_qm > 0 ? verkaufspreis_grundstueck/grundstueck_qm : null;
    const deckungsbeitrag_grundstueck = verkaufspreis_haus - gestehungskosten;

    sumWohnflaeche += wohnflaeche; sumHauskosten += hauskosten; sumVerkaufspreisHaus += verkaufspreis_haus;
    sumGestehungskosten += gestehungskosten; sumDeckungsbeitragGrundstueck += deckungsbeitrag_grundstueck; sumVerkaufspreisGrundstueck += verkaufspreis_grundstueck;
    sumGrundstueckQm += grundstueck_qm;

    return { id:p.id, wohnflaeche, baukosten_pro_m2, hauskosten, grundstueck_qm,
      grundstueckskosten_ek:grundstueckskostenEkJeParzelle, gestehungskosten, verkaufspreis_haus, verkaufspreis_haus_je_qm,
      verkaufspreis_grundstueck, verkaufspreis_grundstueck_je_qm, deckungsbeitrag_grundstueck };
  });

  const gik = bruttokaufpreis + sonstigeKostenGesamt;
  const ek_pct = c.eigenkapital_pct != null ? c.eigenkapital_pct : 20;
  const eigenkapital = gik * ek_pct/100;
  const fremdkapital = gik - eigenkapital;
  const laufzeit_monate = c.laufzeit_monate || 0;
  const zinskosten = (c.zinssatz_pct_pa||0)/100 * fremdkapital/12 * laufzeit_monate;
  const bearbeitungsgebuehr = (c.bearbeitungsgebuehr_pct||0)/100 * fremdkapital;
  const finanzierungskosten = zinskosten + bearbeitungsgebuehr;
  const vertriebskosten = (c.vertriebskosten_pct||0)/100 * sumVerkaufspreisHaus;
  const sonstigeKostenErtrag = (c.sonstige_kosten_ertrag_pct||0)/100 * sumVerkaufspreisHaus;

  const deckungsbeitrag = sumDeckungsbeitragGrundstueck - finanzierungskosten - vertriebskosten - sonstigeKostenErtrag;
  const deckungsbeitrag_pct = gik > 0 ? (deckungsbeitrag/gik)*100 : null;
  const ek_rendite_pct = eigenkapital > 0 ? (deckungsbeitrag/eigenkapital)*100 : null;

  return {
    gewinn: deckungsbeitrag, marge_pct: deckungsbeitrag_pct, rendite_ek_pct: ek_rendite_pct,
    gesamtkosten: gik, verkaufserloes: sumVerkaufspreisHaus,
    nettokaufpreis, grest, notar, makler, sonstigeErwerb, erwerbsnebenkosten, erwerbsnebenkosten_pct, bruttokaufpreis, bruttokaufpreis_je_qm,
    bodenrichtwert_gesamt, bodenrichtwert_je_qm, nettokaufpreis_je_qm,
    kaufpreiswunsch_gesamt, kaufpreiswunsch_je_qm, abwWunschAbs, abwWunschPct, abwBrwAbs, abwBrwPct,
    baunebenkostenItems, sonstigeKostenGesamt,
    anzahlParzellen, grundstueckJeParzelle, grundstueckskostenEkJeParzelle,
    sumWohnflaeche, sumHauskosten, sumGestehungskosten, sumVerkaufspreisGrundstueck,
    sumDeckungsbeitragGrundstueck, sumGrundstueckQm, parzellenErgebnis,
    gik, eigenkapital, fremdkapital, zinskosten, bearbeitungsgebuehr, finanzierungskosten,
    vertriebskosten, sonstigeKostenErtrag, deckungsbeitrag, deckungsbeitrag_pct, ek_rendite_pct,
  };
}

/* ==================== DASHBOARD ==================== */
function periodBuckets(granularity, count){
  const buckets = [];
  const now = new Date();
  if(granularity === 'week'){
    const day = (now.getDay()+6)%7; // 0=Mo
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    monday.setDate(monday.getDate()-day);
    for(let i=count-1;i>=0;i--){
      const start = new Date(monday); start.setDate(monday.getDate()-7*i);
      const end = new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
      const label = `${String(start.getDate()).padStart(2,'0')}.${String(start.getMonth()+1).padStart(2,'0')}.`;
      buckets.push({start, end, label});
    }
  } else {
    for(let i=count-1;i>=0;i--){
      const start = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const end = new Date(now.getFullYear(), now.getMonth()-i+1, 0, 23,59,59,999);
      const label = start.toLocaleDateString('de-DE', {month:'short', year:'2-digit'});
      buckets.push({start, end, label});
    }
  }
  return buckets;
}
function countInBucket(objs, bucket){
  return objs.filter(o=>{
    const c = new Date(o.createdAt);
    return c >= bucket.start && c <= bucket.end;
  }).length;
}

function renderDashboard(main){
  const typeFilter = STATE.filters.type;
  const byType = (list)=> typeFilter === 'all' ? list : list.filter(o=>o.type===typeFilter);

  const objs = byType(STATE.objects.filter(o=>o.phase !== 'abgesagt'));
  const totalVolume = objs.reduce((s,o)=>s+objVolume(o),0);
  const margins = objs.map(o=>getCalcResult(o).marge_pct).filter(v=>v!=null && isFinite(v));
  const avgMargin = margins.length ? margins.reduce((a,b)=>a+b,0)/margins.length : null;

  let overdue = [];
  STATE.objects.forEach(o=>{ (o.tasks||[]).forEach(t=>{ if(taskStatus(t)==='overdue') overdue.push({obj:o, task:t}); }); });
  overdue = overdue.filter(x => typeFilter==='all' || x.obj.type===typeFilter);
  overdue.sort((a,b)=> (a.task.due||'').localeCompare(b.task.due||''));

  const phaseRows = PHASES.map(p=>{
    const inPhase = objs.filter(o=>o.phase===p.key);
    const vol = inPhase.reduce((s,o)=>s+objVolume(o),0);
    return {label:p.label, count:inPhase.length, vol};
  });
  const maxVol = Math.max(1, ...phaseRows.map(r=>r.vol));

  // Cancelled deals grouped by reason
  const cancelled = byType(STATE.objects.filter(o=>o.phase==='abgesagt'));
  const reasonMap = {};
  cancelled.forEach(o=>{
    const reason = (o.absage_grund||'').trim() || 'Kein Grund angegeben';
    reasonMap[reason] = (reasonMap[reason]||0) + 1;
  });
  const reasonRows = Object.entries(reasonMap).map(([reason,count])=>({reason,count})).sort((a,b)=>b.count-a.count);
  const maxReasonCount = Math.max(1, ...reasonRows.map(r=>r.count));

  // Neue Deals über Zeit (Woche/Monat)
  const period = STATE.dashboardPeriod || 'month';
  const bucketCount = period === 'week' ? 8 : 6;
  const buckets = periodBuckets(period, bucketCount);
  const typedAll = byType(STATE.objects);
  const bucketCounts = buckets.map(b=>countInBucket(typedAll, b));
  const maxBucket = Math.max(1, ...bucketCounts);

  main.innerHTML = `
    <div class="view-header">
      <div>
        <h1>Dashboard</h1>
        <p class="sub">Gesamte Angebots-Pipeline auf einen Blick.</p>

      <button class="chip ${typeFilter==='pe'?'active':''}" data-type="pe">Grundstücke</button>
      <button class="chip ${typeFilter==='mfh'?'active':''}" data-type="mfh">Mehrfamilienhäuser</button>
    </div>

    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Investitionsvolumen Pipeline</div><div class="kpi-value">${fmtMoney(totalVolume)}</div><div class="kpi-sub">über ${objs.length} aktive Angebote</div></div>
      <div class="kpi-card"><div class="kpi-label">Angebote je Phase</div><div class="kpi-value">${objs.length}</div><div class="kpi-sub">${PHASES.map(p=>`${p.label.split(' ')[0]}: ${objs.filter(o=>o.phase===p.key).length}`).join(' · ')}</div></div>
      <div class="kpi-card"><div class="kpi-label">Ø erwartete Marge</div><div class="kpi-value">${avgMargin!=null ? fmtPct(avgMargin) : '–'}</div><div class="kpi-sub">auf Basis aktueller Kalkulationen</div></div>
      <div class="kpi-card"><div class="kpi-label">Überfällige Aufgaben</div><div class="kpi-value ${overdue.length?'danger':''}">${overdue.length}</div><div class="kpi-sub">objektübergreifend</div></div>
    </div>

    <div class="panel funnel-panel" id="funnelPanel"></div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
        <h3 style="margin:0;">Neue Deals</h3>
        <div class="metric-toggle" id="periodToggle">
          <button class="metric-btn ${period==='week'?'active':''}" data-period="week">Woche</button>
          <button class="metric-btn ${period==='month'?'active':''}" data-period="month">Monat</button>
        </div>
      </div>
      <div class="funnel-chart" style="height:160px;">
        ${buckets.map((b,i)=>{
          const val = bucketCounts[i];
          const heightPct = maxBucket>0 ? Math.max(2, val/maxBucket*100) : 2;
          return `
          <div class="funnel-col" style="min-width:56px;">
            <div class="funnel-value">${val}</div>

    <div class="panel">

      ${phaseRows.map(r=>`
        <div class="bar-row">

          <div class="bar-track"><div class="bar-fill" style="width:${(r.vol/maxVol*100).toFixed(1)}%"></div></div>
          <div class="count">${r.count} · ${fmtMoney(r.vol)}</div>
        </div>`).join('')}
    </div>

    <div class="panel">
      <h3>Abgesagte Deals nach Absagegrund</h3>
      ${reasonRows.length ? reasonRows.map(r=>`
        <div class="bar-row">
          <div class="label" title="${escapeHtml(r.reason)}">${escapeHtml(r.reason)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(r.count/maxReasonCount*100).toFixed(1)}%; background:var(--danger);"></div></div>
          <div class="count">${r.count} Deal${r.count===1?'':'s'}</div>

      <h3>Überfällige Aufgaben</h3>

    </div>

    renderDashboard(main);
  });
  renderFunnelChart(document.getElementById('funnelPanel'));
}

/* ---------------- FUNNEL / KONVERSIONS-CHART ---------------- */
function renderFunnelChart(container){
  const metric = STATE.dashboardMetric;
  const typeFilter = STATE.filters.type;
  const typedObjects = typeFilter==='all' ? STATE.objects : STATE.objects.filter(o=>o.type===typeFilter);
  const stages = [...PHASES, PHASE_ABSAGE]; // neu..notar, abgesagt
  const valueFor = (phaseKey)=>{
    const inPhase = typedObjects.filter(o=>o.phase===phaseKey);
    return metric === 'volume' ? inPhase.reduce((s,o)=>s+objVolume(o),0) : inPhase.length;
  };
  const bars = stages.map(p=>({ key:p.key, label:p.label, value: valueFor(p.key) }));
  const maxVal = Math.max(1, ...bars.map(b=>b.value));

  const countNotar = typedObjects.filter(o=>o.phase==='notar').length;
  const countAbgesagt = typedObjects.filter(o=>o.phase==='abgesagt').length;
  const volNotar = typedObjects.filter(o=>o.phase==='notar').reduce((s,o)=>s+objVolume(o),0);
  const volAbgesagt = typedObjects.filter(o=>o.phase==='abgesagt').reduce((s,o)=>s+objVolume(o),0);
  let winRate = null;
  if(metric === 'volume'){
    const denom = volNotar + volAbgesagt;
    winRate = denom > 0 ? (volNotar/denom*100) : 0;
  } else {
    const denom = countNotar + countAbgesagt;
    winRate = denom > 0 ? (countNotar/denom*100) : 0;
  }

  const fmtVal = (v)=> metric === 'volume' ? fmtMoney(v) : fmtNum(v,0);

  container.innerHTML = `
    <div class="funnel-top">
      <div class="funnel-title"><span class="funnel-icon">📊</span> Konversion — Pipeline</div>
      <div class="funnel-sub">${STATE.filters.type==='all' ? 'ALLE TYPEN' : (STATE.filters.type==='pe'?'PROJEKTENTWICKLUNG':'MFH-AUFTEILUNG')} · GESAMT</div>
    </div>
    <div class="funnel-headline">Gewinnquote liegt bei ${fmtNum(winRate,0)}%</div>
    <div class="metric-toggle" id="metricToggle">
      <button class="metric-btn ${metric==='count'?'active':''}" data-metric="count">Anzahl Deals</button>
      <button class="metric-btn ${metric==='volume'?'active':''}" data-metric="volume">Ankaufsvolumen</button>
    </div>
    <div class="funnel-chart">
      ${bars.map((b,i)=>{
        const heightPct = maxVal>0 ? Math.max(2, b.value/maxVal*100) : 2;
        const isWon = b.key === 'notar';
        const isCancelled = b.key === 'abgesagt';
        const barColor = isWon ? 'var(--ok)' : (isCancelled ? '#D9D9DE' : '#F4C74A');
        let arrowHtml = '';
        if(i < bars.length-1){
          const next = bars[i+1];
          const pct = b.value>0 ? Math.round(next.value/b.value*100) : 0;
          arrowHtml = `<div class="funnel-arrow">${pct}%</div>`;
        }
        return `
          <div class="funnel-col">
            <div class="funnel-value">${fmtVal(b.value)}</div>
            <div class="funnel-bar" style="height:${heightPct}%; background:${barColor};"></div>
            <div class="funnel-label">${b.label}</div>
          </div>
          ${arrowHtml}
        `;
      }).join('')}
    </div>
    <div class="funnel-legend">
      <span class="legend-dot" style="background:#F4C74A;"></span> Erreichte Phase
      <span class="legend-dot" style="background:var(--ok); margin-left:16px;"></span> Gewonnen
      <span class="legend-dot" style="background:#D9D9DE; margin-left:16px;"></span> Abgesagt
    </div>
  `;
  document.getElementById('metricToggle').addEventListener('click', (e)=>{
    const btn = e.target.closest('.metric-btn');
    if(!btn) return;
    STATE.dashboardMetric = btn.dataset.metric;
    renderFunnelChart(container);
  });
}

function wireToolbar(rerender){
  const modeToggle = document.getElementById('pipelineModeToggle');
  if(modeToggle) modeToggle.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    STATE.pipelineMode = btn.dataset.mode;
    rerender();
  });
  const searchInput = document.getElementById('searchInput');
  if(searchInput) searchInput.addEventListener('input', (e)=>{ STATE.filters.search = e.target.value; rerender(); });
  document.querySelectorAll('.chip-row .chip').forEach(el=>{
    el.addEventListener('click', ()=>{ STATE.filters.type = el.dataset.type; rerender(); });
  });
  const phaseBtn = document.getElementById('phaseFilterBtn');
  const phasePanel = document.getElementById('phaseFilterPanel');
  if(phaseBtn){
    phaseBtn.addEventListener('click', (e)=>{ e.stopPropagation(); phasePanel.style.display = phasePanel.style.display==='none'?'block':'none'; });
    phasePanel.querySelectorAll('[data-phase-check]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const val = cb.value;
        if(cb.checked){ if(!STATE.filters.phases.includes(val)) STATE.filters.phases.push(val); }
        else{ STATE.filters.phases = STATE.filters.phases.filter(p=>p!==val); }
        rerender();
      });
    });
  }
  const sortBtn = document.getElementById('sortBtn');
  const sortPanel = document.getElementById('sortPanel');
  if(sortBtn){
    sortBtn.addEventListener('click', (e)=>{ e.stopPropagation(); sortPanel.style.display = sortPanel.style.display==='none'?'block':'none'; });
    sortPanel.querySelectorAll('[data-sort-radio]').forEach(rb=>{
      rb.addEventListener('change', ()=>{ STATE.filters.sort = rb.value; rerender(); });
    });
  }
  document.addEventListener('click', ()=>{
    if(phasePanel) phasePanel.style.display='none';
    if(sortPanel) sortPanel.style.display='none';
  }, {once:true});
}

          <div class="kanban-cards" data-phase-drop="${p.key}">${inPhase.map(o=>renderCard(o)).join('')}</div>
        </div>`;
      }).join('')}
    </div>
  `;
  wireToolbar(()=>renderPipelineView(main));
  main.querySelectorAll('[data-card-id]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(el.classList.contains('was-dragged')) return;
      openObjectModal(el.dataset.cardId);
    });
  });
  wireKanbanDragAndDrop(main);
}

function wireKanbanDragAndDrop(main){
  let draggedId = null;
  let dragMoved = false;

  main.querySelectorAll('.card[data-card-id]').forEach(card=>{
    card.addEventListener('dragstart', (e)=>{
      draggedId = card.dataset.cardId;
      dragMoved = false;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', draggedId); }catch(err){}
    });
    card.addEventListener('drag', ()=>{ dragMoved = true; });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      if(dragMoved){
        card.classList.add('was-dragged');
        setTimeout(()=>card.classList.remove('was-dragged'), 250);
      }
      main.querySelectorAll('.kanban-col.drag-over').forEach(c=>c.classList.remove('drag-over'));
      draggedId = null;
    });
  });

  main.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', ()=>{ col.classList.remove('drag-over'); });
    col.addEventListener('drop', async (e)=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = draggedId || e.dataTransfer.getData('text/plain');
      const newPhase = col.dataset.phaseCol;
      const obj = getObj(id);
      if(obj && newPhase && obj.phase !== newPhase){
        obj.phase = newPhase;
        obj.updatedAt = new Date().toISOString();
        await storageSave(STORE_PREFIX, obj);
        renderPipelineView(main);
      }
    });
  });
}

      <table class="deals">

function renderCard(o){

  openTasks.forEach(t=>{ const s = taskStatus(t); if(order[s] > order[worstStatus]) worstStatus = s; });

  return `
    <div class="card" data-card-id="${o.id}" draggable="true">
      <div class="card-top">

}

/* Waehrend ein Kalkulationsfeld aktiv getippt wird, zeigen wir den Rohtext
   des Nutzers unveraendert an (kein Tausender-/Nachkommastellen-Formatting
   mitten im Tippen) -- sonst wuerde z.B. "5,95" beim zweiten Zeichen zu
   "5,00" umformatiert und das eigene Komma des Nutzers landet hinter der
   bereits ergaenzten Nachkommastelle ("5,00,"). Formatiert wird erst wieder,
   sobald ein anderes Feld editiert wird bzw. der Tab neu geoeffnet wird. */
let CALC_RAW_EDIT = null; // {kind:'c'|'p'|'bnk', key, pid, raw}
let CALC_RAW_EDIT_TIMER = null;
function calcInputValue(kind, key, pid, rawNum, decimals){
  if(CALC_RAW_EDIT && CALC_RAW_EDIT.kind===kind && CALC_RAW_EDIT.key===key && CALC_RAW_EDIT.pid===(pid ?? null)){
    return CALC_RAW_EDIT.raw;
  }
  return formatEditableNumber(rawNum, decimals);

function formattedAddress(obj){
  return [obj.address, [obj.plz, obj.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ');
}
/* Der Deal-Name (Kanban-Karte, Listenansicht) hat kein eigenes Eingabefeld mehr
   (Kopfzeile zeigt nur noch die Adresse, nicht editierbar) -- daher hier
   automatisch mitziehen, sobald sich die Adresse aendert. */
function syncTitleFromAddress(obj){
  if(obj.address) obj.title = formattedAddress(obj);
}
function setupAddressAutocomplete(body, obj, onSelect){
  const input = body.querySelector('#addressAutocomplete');
  const box = body.querySelector('#addressSuggestions');
  if(!input || !box) return;
  let debounceTimer = null;
  let currentSeq = 0;

  input.value = formattedAddress(obj);

  function closeBox(){ box.classList.remove('open'); box.innerHTML = ''; }

  input.addEventListener('input', ()=>{
    const q = input.value.trim();
    clearTimeout(debounceTimer);
    if(q.length < 3){ closeBox(); return; }
    debounceTimer = setTimeout(()=>{
      const seq = ++currentSeq;
      const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lang=de&limit=6&lat=50.68&lon=8.69&bbox=7.7,49.35,10.25,51.75`;
      fetch(url).then(r=>r.json()).then(data=>{
        if(seq !== currentSeq) return;
        const feats = (data && data.features) || [];
        if(!feats.length){
          box.innerHTML = '<div class="address-suggestion" style="cursor:default; color:var(--text-faint);">Keine Treffer</div>';
          box.classList.add('open');
          return;
        }
        box.innerHTML = feats.map((f,i)=>{
          const p = f.properties || {};
          const main = [p.street, p.housenumber].filter(Boolean).join(' ') || p.name || '–';
          const sub = [p.postcode, p.city || p.town || p.village].filter(Boolean).join(' ');
          return `<div class="address-suggestion" data-idx="${i}"><div class="as-main">${escapeHtml(main)}</div><div class="as-sub">${escapeHtml(sub)}</div></div>`;
        }).join('');
        box.classList.add('open');
        box.querySelectorAll('.address-suggestion[data-idx]').forEach(el=>{
          el.addEventListener('mousedown', (e)=>{
            e.preventDefault();
            const f = feats[Number(el.dataset.idx)];
            const p = f.properties || {};
            const [lng, lat] = f.geometry.coordinates;
            obj.address = [p.street, p.housenumber].filter(Boolean).join(' ') || obj.address;
            obj.plz = p.postcode || obj.plz;
            obj.ort = p.city || p.town || p.village || obj.ort;
            if(p.state && BUNDESLAENDER.includes(p.state)) obj.bundesland = p.state;
            obj.lat = lat; obj.lng = lng;
            syncTitleFromAddress(obj);
            scheduleSave(obj);
            closeBox();
            input.value = formattedAddress(obj);
            onSelect && onSelect();
          });
        });
      }).catch(()=>{
        box.innerHTML = '<div class="address-suggestion" style="cursor:default; color:var(--text-faint);">Adresssuche nicht erreichbar (offline?)</div>';
        box.classList.add('open');
      });
    }, 300);
  });

  /* Adresse nicht gefunden: kein Treffer angeklickt, aber Text eingegeben ->
     beim Verlassen des Feldes den getippten Text direkt als Adresse
     uebernehmen (Straße/PLZ/Ort lassen sich dann nicht mehr automatisch
     trennen, deshalb landet alles gesammelt in "Adresse"). */
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{
      closeBox();
      const typed = input.value.trim();
      if(typed && typed !== formattedAddress(obj)){
        obj.address = typed;
        obj.plz = '';
        obj.ort = '';
        syncTitleFromAddress(obj);
        scheduleSave(obj);
        onSelect && onSelect();
      }
    }, 150);
  });
}

function abwWunschFarbe(abwAbs, abwPct){
  if(abwAbs == null) return 'var(--text-faint)';

  if(abwPct != null && Math.abs(abwPct) < 10) return 'var(--warn)';

function calcLine(label, field, ansatzVal, unit, gesamtVal, opts){
  opts = opts || {};
  const isInput = field != null;
  const decimals = opts.decimals ?? 0;
  return `
    <div class="calc-line ${opts.bold?'total':''}">
      <div class="cl-label">${label}</div>

/* Findet per Bisektion den Nettokaufpreis, bei dem die Projektmarge
   (Deckungsbeitrag % v. GIK) den Zielwert erreicht. Die Marge faellt mit
   steigendem Kaufpreis monoton (Erloes ist fix, GIK steigt) -- Bisektion ist
   damit ein sicheres, formel-unabhaengiges Verfahren. */
function solveNettokaufpreisFuerMarge(obj, targetPct){
  const originalPreis = obj.calc.nettokaufpreis;
  let lo = 0, hi = Math.max(2000000, obj.calc.parcels.length * 600000 * 3);
  for(let i=0; i<60; i++){
    const mid = (lo + hi) / 2;
    obj.calc.nettokaufpreis = mid;
    const r = calcPE(obj);
    if(r.deckungsbeitrag_pct > targetPct){ lo = mid; } else { hi = mid; }
  }
  const solved = (lo + hi) / 2;
  obj.calc.nettokaufpreis = originalPreis;
  return solved;
}

const BASIS_SZENARIO_QM_JE_PARZELLE = 250;

function planBasisSzenario(obj){
  const groesse = obj.grundstuecksgroesse || 0;
  const anzahlParzellen = Math.floor(groesse / BASIS_SZENARIO_QM_JE_PARZELLE);
  if(anzahlParzellen < 1){
    alert(`Grundstücksgröße muss mindestens ${BASIS_SZENARIO_QM_JE_PARZELLE} m² betragen.`);
    return;
  }
  const baukosten_pro_m2 = anzahlParzellen <= 3 ? 3000 : 2650;
  obj.calc.parcels = Array.from({length: anzahlParzellen}, () => ({
    id: taskId(), wohnflaeche: 130, baukosten_pro_m2, verkaufspreis_haus: 600000, grundstueck_qm: BASIS_SZENARIO_QM_JE_PARZELLE,
  }));
  obj.einheiten = anzahlParzellen;
  obj.calc.baunebenkosten_items = anzahlParzellen <= 3 ? [] : [
    {id:bnkId(), label:'Hausanschlusskosten', mode:'je_haus', ansatz:15000},
    {id:bnkId(), label:'Grundstücksteilung', mode:'je_haus', ansatz:5000},
    {id:bnkId(), label:'Abrisskosten', mode:'pauschal', ansatz:0},
    {id:bnkId(), label:'Sonstige Kosten', mode:'pauschal', ansatz:10000},
  ];
  const solvedPreis = solveNettokaufpreisFuerMarge(obj, 25);
  obj.calc.nettokaufpreis = Math.round(solvedPreis/100)*100;
}

const GRUNDSTUECK_SERVICE_URL = 'http://127.0.0.1:5001';
let MULTI_SELECT = null; // {active:true, results:[...]} waehrend "Mehrere Flurstuecke" aktiv ist

/* Lat/Lon -> lokale Meter-Koordinaten (gleiche Naeherung wie im Python-Dienst) */
function localXYJS(coords, lat0, lng0){
  const mLat = 111320.0;
  const mLng = 111320.0 * Math.cos(lat0 * Math.PI/180);
  return coords.map(([lat,lng]) => [(lng-lng0)*mLng, (lat-lat0)*mLat]);
}
function convexHullJS(points){
  const pts = [...points].sort((a,b)=> a[0]-b[0] || a[1]-b[1]);
  if(pts.length <= 2) return pts;
  const cross = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lower = [];
  for(const p of pts){
    while(lower.length>=2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for(let i=pts.length-1; i>=0; i--){
    const p = pts[i];
    while(upper.length>=2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function minBoundingRectangleJS(hull){
  const n = hull.length;
  if(n < 3){
    const xs = hull.map(p=>p[0]), ys = hull.map(p=>p[1]);
    return [Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys)];
  }
  let bestArea = null, bestDims = [0,0];
  for(let i=0;i<n;i++){
    const [x1,y1] = hull[i];
    const [x2,y2] = hull[(i+1)%n];
    const angle = Math.atan2(y2-y1, x2-x1);
    const c = Math.cos(-angle), s = Math.sin(-angle);
    const rotated = hull.map(([px,py]) => [px*c - py*s, px*s + py*c]);
    const xs = rotated.map(p=>p[0]), ys = rotated.map(p=>p[1]);
    const w = Math.max(...xs)-Math.min(...xs), h = Math.max(...ys)-Math.min(...ys);
    const area = w*h;
    if(bestArea===null || area<bestArea){ bestArea = area; bestDims=[w,h]; }
  }
  return bestDims;
}
/* Fasst mehrere einzeln abgefragte Flurstuecke (Ergebnisse von /grundstueck) zu
   einer Gesamtgroesse zusammen: Flaechen werden amtlich aufsummiert, Laenge/Breite
   ueber die konvexe Huelle ALLER beteiligten Eckpunkte (kein echtes Polygon-Union
   noetig, da die Huelle fuer die Bounding-Box-Messung ausreicht), Bodenrichtwert
   als flaechengewichteter Durchschnitt. */
function combineFlurstuecke(results){
  const allPoints = [];
  results.forEach(r => (r.polygon||[]).forEach(p => allPoints.push(p)));
  const lat0 = allPoints.reduce((s,p)=>s+p[0],0) / allPoints.length;
  const lng0 = allPoints.reduce((s,p)=>s+p[1],0) / allPoints.length;
  const xy = localXYJS(allPoints, lat0, lng0);
  const hull = convexHullJS(xy);
  const [a, b] = minBoundingRectangleJS(hull);
  const length_m = Math.max(a,b), width_m = Math.min(a,b);
  const area_qm = results.reduce((s,r)=>s+(r.area_qm||0), 0);
  const brwEntries = results.filter(r=>r.bodenrichtwert_eur_m2!=null);
  let bodenrichtwert_eur_m2 = null;
  if(brwEntries.length){
    const totalArea = brwEntries.reduce((s,r)=>s+(r.area_qm||0), 0);
    bodenrichtwert_eur_m2 = totalArea > 0
      ? brwEntries.reduce((s,r)=>s + r.bodenrichtwert_eur_m2*(r.area_qm||0), 0) / totalArea
      : brwEntries.reduce((s,r)=>s + r.bodenrichtwert_eur_m2, 0) / brwEntries.length;
  }
  return { area_qm, length_m, width_m, bodenrichtwert_eur_m2 };
}

async function erfasseGrundstueckViaPython(container, obj){
  if(obj.lat == null || obj.lng == null){
    alert('Bitte zuerst eine Position auf der Karte setzen oder eine Adresse auswählen.');
    return;
  }
  const btn = container.querySelector('#grundstueckErfassenBtn');
  const origLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Suche Flurstück…'; }
  try{
    const res = await fetch(`${GRUNDSTUECK_SERVICE_URL}/grundstueck?lat=${obj.lat}&lng=${obj.lng}`);
    const data = await res.json();
    if(!res.ok || !data.ok){
      throw new Error(data.error || `Dienst antwortete mit Status ${res.status}`);
    }
    obj.polygon = data.polygon;
    obj.polygon_area = data.area_qm;
    obj.grundstuecksgroesse = Math.round(data.area_qm);
    obj.grundstueck_laenge = data.length_m;
    obj.grundstueck_breite = data.width_m;
    if(data.label) obj.flurstueck = data.label;
    obj.flurstueck_amtlich = { label: data.label, area: data.area_qm, ref: data.nationalCadastralReference };
    if(data.bodenrichtwert_eur_m2 != null){
      obj.bodenrichtwert = Math.round(data.bodenrichtwert_eur_m2);
      obj.bodenrichtwert_amtlich = {
        wert: data.bodenrichtwert_eur_m2, stichtag: data.bodenrichtwert_stichtag,
        nutzung: data.bodenrichtwert_nutzung, gemarkung: data.bodenrichtwert_gemarkung,
        nummer: data.bodenrichtwert_nummer,
      };
    }
    scheduleSave(obj);
    renderKarteInto(container, obj);
  }catch(err){
    alert('Grundstücks-Dienst nicht erreichbar. Bitte prüfen, ob "python grundstueck_service.py" läuft (siehe Datei im Projektordner).\n\nDetails: ' + err.message);
    if(btn){ btn.disabled = false; btn.textContent = origLabel; }
  }
}

function initMap(obj, viewOverride){
  if(MODAL.map){ MODAL.map.remove(); MODAL.map = null; }
  const center = viewOverride ? viewOverride.center : ((obj.lat != null && obj.lng != null) ? [obj.lat, obj.lng] : DEFAULT_CENTER);
  const zoom = viewOverride ? viewOverride.zoom : ((obj.lat != null) ? 18 : 9);
  const map = L.map('map', {maxZoom:23}).setView(center, zoom);
  MODAL.map = map;

  const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:23, maxNativeZoom:20, attribution:'Esri World Imagery'}).addTo(map);
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:23, maxNativeZoom:19, attribution:'&copy; OpenStreetMap'});
  const flurstueckeWms = L.tileLayer.wms(HESSEN_WMS_URL, {layers:HESSEN_WMS_LAYER, format:'image/png', transparent:true, version:'1.1.1', maxZoom:23, maxNativeZoom:19, attribution:'Geobasisdaten © HVBG'}).addTo(map);
  L.control.layers({'Satellit (Esri)':esriSat, 'Straßenkarte (OSM)':osm}, {'Flurstücksgrenzen (Geoportal Hessen)':flurstueckeWms}).addTo(map);

  const drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);
  MODAL.drawnItems = drawnItems;
  if(obj.grundstueck_teile && obj.grundstueck_teile.length){
    obj.grundstueck_teile.forEach(t=>{
      if(t.polygon && t.polygon.length) drawnItems.addLayer(L.polygon(t.polygon, {color:'#5B4CF0', weight:2, fillOpacity:0.15}));
    });
  } else if(obj.polygon && obj.polygon.length){
    drawnItems.addLayer(L.polygon(obj.polygon, {color:'#5B4CF0', weight:2, fillOpacity:0.15}));
  }
  if(MULTI_SELECT && MULTI_SELECT.active){
    MULTI_SELECT.results.forEach(r=>{
      if(r.polygon && r.polygon.length) drawnItems.addLayer(L.polygon(r.polygon, {color:'#FF9500', weight:2, fillOpacity:0.2, dashArray:'4 3'}));
    });
  }

  let marker = null;
  if(obj.lat != null && obj.lng != null){
    marker = L.marker([obj.lat, obj.lng], {draggable:true}).addTo(map);
    marker.on('dragend', ()=>{
      const p = marker.getLatLng();
      obj.lat = p.lat; obj.lng = p.lng; scheduleSave(obj);
    });
  }

  map.on('click', (e)=>{
    if(MULTI_SELECT && MULTI_SELECT.active){
      addMultiFlurstueckPoint(e.latlng.lat, e.latlng.lng, map);
      return;
    }
    if(!marker){
      marker = L.marker(e.latlng, {draggable:true}).addTo(map);
      marker.on('dragend', ()=>{
        const p = marker.getLatLng();
        obj.lat = p.lat; obj.lng = p.lng; scheduleSave(obj);
      });
    } else { marker.setLatLng(e.latlng); }
    obj.lat = e.latlng.lat; obj.lng = e.latlng.lng; scheduleSave(obj);
    const btn = document.getElementById('grundstueckErfassenBtn');
    if(btn){ btn.disabled = false; btn.removeAttribute('title'); }
  });

  setTimeout(()=>{ if(MODAL.map === map){ try{ map.invalidateSize(); }catch(e){} } }, 150);

  async function addMultiFlurstueckPoint(lat, lng, mapRef){
    try{
      const res = await fetch(`${GRUNDSTUECK_SERVICE_URL}/grundstueck?lat=${lat}&lng=${lng}`);
      const data = await res.json();
      if(!res.ok || !data.ok){ alert(data.error || `Dienst antwortete mit Status ${res.status}`); return; }
      if(MULTI_SELECT.results.some(r=>r.nationalCadastralReference === data.nationalCadastralReference)){
        alert('Dieses Flurstück ist bereits in der Auswahl.');
        return;
      }
      MULTI_SELECT.results.push(data);
      MULTI_SELECT.savedView = {center: mapRef.getCenter(), zoom: mapRef.getZoom()};
      const container = document.getElementById('karteSection');
      if(container) renderKarteInto(container, obj);
    }catch(err){
      alert('Grundstücks-Dienst nicht erreichbar. Bitte prüfen, ob "python grundstueck_service.py" läuft.\n\nDetails: ' + err.message);
    }
  }
}
