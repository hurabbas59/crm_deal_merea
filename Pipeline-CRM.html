/* ==================== EXCEL SYNC ==================== */
const EXCEL_STATE = { handle:null, fileName:null, syncing:false, needsPermission:false };

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('pipeline_excel_db', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSetHandle(handle){
  try{
    const db = await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'excelFile');
      tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.error('idbSetHandle failed', e); }
}
async function idbGetHandle(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get('excelFile');
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ console.error('idbGetHandle failed', e); return null; }
}
async function idbClearHandle(){
  try{
    const db = await idbOpen();
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').delete('excelFile');
  }catch(e){}
}

async function excelTryRestoreHandle(){
  if(typeof window.showSaveFilePicker !== 'function') return;
  const handle = await idbGetHandle();
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){
      EXCEL_STATE.handle = handle;
      EXCEL_STATE.fileName = handle.name;
      await excelAutoImportFromHandle(handle);
    } else {
      EXCEL_STATE.handle = null;
      EXCEL_STATE.fileName = handle.name;
      EXCEL_STATE.needsPermission = true;
      EXCEL_STATE.pendingHandle = handle;
    }
  }catch(e){ console.error('Berechtigungsprüfung fehlgeschlagen', e); }
  renderExcelBox();
}

async function excelConfirmPermission(){
  const handle = EXCEL_STATE.pendingHandle;
  if(!handle) return;
  try{
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm === 'granted'){
      EXCEL_STATE.handle = handle;
      EXCEL_STATE.fileName = handle.name;
      EXCEL_STATE.needsPermission = false;
      EXCEL_STATE.pendingHandle = null;
      await excelAutoImportFromHandle(handle);
      const [objects, contacts] = await Promise.all([storageList(STORE_PREFIX), storageList(CONTACT_PREFIX)]);
      STATE.objects = objects;
      STATE.contacts = contacts;
      renderApp();
      renderExcelBox();
    }
  }catch(e){ console.error('Berechtigung fehlgeschlagen', e); }
}

/* Wird beim Öffnen des Tools (bzw. sobald Zugriff auf die verknüpfte Datei besteht)
   einmalig aufgerufen, damit Änderungen, die direkt in Excel gemacht wurden,
   automatisch in die lokale Datenbank übernommen werden. */
async function excelAutoImportFromHandle(handle){
  try{
    const file = await handle.getFile();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    await excelApplyWorkbook(wb);
    setExcelStatus(`Beim Öffnen aus "${EXCEL_STATE.fileName}" aktualisiert · ${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`, true);
  }catch(e){
    console.error('Automatischer Excel-Import beim Start fehlgeschlagen', e);
  }
}
const EXCEL_COLUMNS = [
  'ID','Titel','Typ','Phase','Straße','PLZ','Ort','Bundesland',
  'Grundstücksgröße_m2','Wohnfläche_m2','Parzellen_Einheiten',
  'Nettokaufpreis','GIK','Deckungsbeitrag','Marge_Pct','EK_Rendite_Pct',
  'Latitude','Longitude','Google_Maps_Link','Eingezeichnete_Flaeche_m2',
  'Ansprechpartner','Telefon','Email','Quelle','AbsageGrund','ErstelltAm','AktualisiertAm',
];

function objectToExcelRow(o){
  const r = getCalcResult(o);
  const contact = o.kontakt_id ? getContact(o.kontakt_id) : null;
  const gmapsLink = (o.lat!=null && o.lng!=null)
    ? `https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}`
    : (o.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([o.address,o.plz,o.ort].filter(Boolean).join(', '))}` : '');
  return {
    ID:o.id, Titel:o.title, Typ:o.type==='pe'?'Projektentwicklung':'MFH-Aufteilung', Phase:phaseLabel(o.phase),
    'Straße':o.address, PLZ:o.plz, Ort:o.ort, Bundesland:o.bundesland,
    'Grundstücksgröße_m2':o.grundstuecksgroesse, 'Wohnfläche_m2':o.wohnflaeche, Parzellen_Einheiten:o.einheiten,
    Nettokaufpreis: o.type==='pe' ? (o.calc&&o.calc.nettokaufpreis) : null,
    GIK: r.gik!=null?r.gik:null, Deckungsbeitrag: r.deckungsbeitrag!=null?r.deckungsbeitrag:null,
    Marge_Pct: r.deckungsbeitrag_pct!=null?Math.round(r.deckungsbeitrag_pct*100)/100:null,
    EK_Rendite_Pct: r.ek_rendite_pct!=null?Math.round(r.ek_rendite_pct*100)/100:null,
    Latitude:o.lat, Longitude:o.lng, Google_Maps_Link:gmapsLink,
    Eingezeichnete_Flaeche_m2: o.polygon_area!=null ? Math.round(o.polygon_area) : null,
    Ansprechpartner: contact?contact.name:'', Telefon: contact?contact.telefon:'', Email: contact?contact.email:'',
    Quelle:o.quelle, AbsageGrund:o.absage_grund,
    ErstelltAm:(o.createdAt||'').slice(0,10), AktualisiertAm:(o.updatedAt||'').slice(0,10),
  };
}

const PARZELLEN_COLUMNS = [
  'Objekt_ID','Objekt_Titel','Parzelle_Nr','Wohnflaeche_m2','Baukosten_je_m2','Hauskosten',
  'Grundstueck_m2','Verkaufspreis_Haus','Gestehungskosten','Deckungsbeitrag',
];
const BNK_COLUMNS = ['Objekt_ID','Objekt_Titel','Bezeichnung','Modus','Ansatz','Gesamt'];

function objectToParzellenRows(o){
  if(o.type !== 'pe') return [];
  const r = getCalcResult(o);
  return (r.parzellenErgebnis||[]).slice(0,10).map((p,i)=>({
    Objekt_ID:o.id, Objekt_Titel:o.title, Parzelle_Nr:i+1,
    Wohnflaeche_m2:p.wohnflaeche, Baukosten_je_m2:p.baukosten_pro_m2, Hauskosten:p.hauskosten,
    Grundstueck_m2:p.grundstueck_qm!=null?Math.round(p.grundstueck_qm):null,
    Verkaufspreis_Haus:p.verkaufspreis_haus, Gestehungskosten:Math.round(p.gestehungskosten),
    Deckungsbeitrag:Math.round(p.deckungsbeitrag_grundstueck),
  }));
}
function objectToBnkRows(o){
  if(o.type !== 'pe') return [];
  const r = getCalcResult(o);
  return (r.baunebenkostenItems||[]).slice(0,10).map(item=>({
    Objekt_ID:o.id, Objekt_Titel:o.title, Bezeichnung:item.label,
    Modus: item.mode==='je_haus' ? 'je Haus' : 'Pauschal', Ansatz:item.ansatz, Gesamt:item.gesamt,
  }));
}

function buildWorkbook(){
  const rows = STATE.objects.map(objectToExcelRow);
  const ws = XLSX.utils.json_to_sheet(rows, {header:EXCEL_COLUMNS});
  ws['!cols'] = EXCEL_COLUMNS.map(c=>({wch: Math.max(12, c.length+2)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pipeline');

  const parzellenRows = STATE.objects.flatMap(objectToParzellenRows);
  const wsParzellen = XLSX.utils.json_to_sheet(parzellenRows, {header:PARZELLEN_COLUMNS});
  wsParzellen['!cols'] = PARZELLEN_COLUMNS.map(c=>({wch: Math.max(14, c.length+2)}));
  XLSX.utils.book_append_sheet(wb, wsParzellen, 'Parzellen');

  const bnkRows = STATE.objects.flatMap(objectToBnkRows);
  const wsBnk = XLSX.utils.json_to_sheet(bnkRows, {header:BNK_COLUMNS});
  wsBnk['!cols'] = BNK_COLUMNS.map(c=>({wch: Math.max(14, c.length+2)}));
  XLSX.utils.book_append_sheet(wb, wsBnk, 'Baunebenkosten');

  return wb;
}

let excelSyncTimer = null;
function scheduleExcelSync(){
  if(!EXCEL_STATE.handle) return;
  clearTimeout(excelSyncTimer);
  excelSyncTimer = setTimeout(()=>{ excelWriteToHandle(); }, 700);
}

async function excelWriteToHandle(){
  if(!EXCEL_STATE.handle || EXCEL_STATE.syncing) return;
  EXCEL_STATE.syncing = true;
  try{
    const wb = buildWorkbook();
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const writable = await EXCEL_STATE.handle.createWritable();
    await writable.write(wbout);
    await writable.close();
    setExcelStatus(`Synchronisiert mit "${EXCEL_STATE.fileName}" · ${fmtDate(todayStr())} ${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`, true);
  }catch(e){
    console.error('Excel-Sync fehlgeschlagen', e);
    setExcelStatus('Synchronisierung fehlgeschlagen – erneut verknüpfen', false);
  }
  EXCEL_STATE.syncing = false;
}

function setExcelStatus(text, linked){
  const el = document.getElementById('excelStatus');
  if(!el) return;
  el.textContent = text;
  el.classList.toggle('linked', !!linked);
}

async function excelLinkFile(){

    const handle = await window.showSaveFilePicker({

    });

}

/* Übernimmt die Zeilen eines eingelesenen Workbooks (Pipeline/Parzellen/Baunebenkosten)
   in STATE.objects + localStorage. WICHTIG: STATE.objects muss zu diesem Zeitpunkt bereits
   mit den echten, gespeicherten Objekten befüllt sein (sonst würde getObj() nichts finden
   und jedes bestehende Objekt fälschlich per newObject() neu angelegt und dabei alle nicht
   in Excel enthaltenen Felder wie Notizen/Aufgaben/Flurstück zurückgesetzt). */
async function excelApplyWorkbook(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:null});
  const parzellenWs = wb.Sheets['Parzellen'];
  const parzellenRows = parzellenWs ? XLSX.utils.sheet_to_json(parzellenWs, {defval:null}) : [];
  const bnkWs = wb.Sheets['Baunebenkosten'];
  const bnkRows = bnkWs ? XLSX.utils.sheet_to_json(bnkWs, {defval:null}) : [];
  let created = 0, updated = 0;
  for(const row of rows){
    const typeRaw = (row.Typ||'').toString().toLowerCase();
    const type = typeRaw.includes('mfh') ? 'mfh' : 'pe';
    let obj = row.ID ? getObj(row.ID) : null;
    if(!obj){
      obj = newObject(type);
      if(row.ID) obj.id = row.ID;
      STATE.objects.push(obj);
      created++;
    } else { updated++; }
    if(row.Titel) obj.title = String(row.Titel);
    if(row['Straße']!=null) obj.address = String(row['Straße']);
    if(row.PLZ!=null) obj.plz = String(row.PLZ);
    if(row.Ort!=null) obj.ort = String(row.Ort);
    if(row.Bundesland!=null && GRUNDERWERBSTEUER[row.Bundesland]!=null) obj.bundesland = row.Bundesland;
    if(row['Grundstücksgröße_m2']!=null) obj.grundstuecksgroesse = Number(row['Grundstücksgröße_m2']);
    if(row['Wohnfläche_m2']!=null) obj.wohnflaeche = Number(row['Wohnfläche_m2']);
    if(row.Parzellen_Einheiten!=null) obj.einheiten = Number(row.Parzellen_Einheiten);
    if(row.Quelle!=null) obj.quelle = String(row.Quelle);
    if(row.AbsageGrund!=null) obj.absage_grund = String(row.AbsageGrund);
    if(row.Latitude!=null && row.Latitude!=='' && !isNaN(Number(row.Latitude))) obj.lat = Number(row.Latitude);
    if(row.Longitude!=null && row.Longitude!=='' && !isNaN(Number(row.Longitude))) obj.lng = Number(row.Longitude);
    if(obj.type==='pe' && row.Nettokaufpreis!=null && obj.calc){ obj.calc.nettokaufpreis = Number(row.Nettokaufpreis); }
    obj.updatedAt = new Date().toISOString();
    await storageSave(STORE_PREFIX, obj);
  }

  if(parzellenRows.length || bnkRows.length){
    const byId = {};
    STATE.objects.forEach(o=>{ byId[o.id] = o; });

    const parzGrouped = {};
    parzellenRows.forEach(row=>{
      const id = row.Objekt_ID; if(!id || !byId[id]) return;
      (parzGrouped[id] = parzGrouped[id]||[]).push(row);
    });
    Object.keys(parzGrouped).forEach(id=>{
      const obj = byId[id];
      if(obj.type!=='pe' || !obj.calc) return;
      const sorted = parzGrouped[id].sort((a,b)=>(a.Parzelle_Nr||0)-(b.Parzelle_Nr||0)).slice(0,10);
      obj.calc.parcels = sorted.map(r=>({
        id: taskId(),
        wohnflaeche: r.Wohnflaeche_m2!=null ? Number(r.Wohnflaeche_m2) : 0,
        baukosten_pro_m2: r.Baukosten_je_m2!=null ? Number(r.Baukosten_je_m2) : 0,
        verkaufspreis_haus: r.Verkaufspreis_Haus!=null ? Number(r.Verkaufspreis_Haus) : 0,
        grundstueck_qm: (r.Grundstueck_m2!=null && r.Grundstueck_m2!=='') ? Number(r.Grundstueck_m2) : null,
      }));
      if(!obj.calc.parcels.length) obj.calc.parcels = [newParcel()];
      obj.einheiten = obj.calc.parcels.length;
    });

    const bnkGrouped = {};
    bnkRows.forEach(row=>{
      const id = row.Objekt_ID; if(!id || !byId[id]) return;
      (bnkGrouped[id] = bnkGrouped[id]||[]).push(row);
    });
    Object.keys(bnkGrouped).forEach(id=>{
      const obj = byId[id];
      if(obj.type!=='pe' || !obj.calc) return;
      obj.calc.baunebenkosten_items = bnkGrouped[id].slice(0,10).map(r=>({
        id: bnkId(),
        label: r.Bezeichnung!=null ? String(r.Bezeichnung) : '',
        mode: (r.Modus||'').toString().toLowerCase().includes('je haus') ? 'je_haus' : 'pauschal',
        ansatz: r.Ansatz!=null ? Number(r.Ansatz) : 0,
      }));
      if(!obj.calc.baunebenkosten_items.length){
        obj.calc.baunebenkosten_items = [{id:bnkId(), label:'Sonstiges', mode:'pauschal', ansatz:0}];
      }
    });

    const touchedIds = new Set([...Object.keys(parzGrouped), ...Object.keys(bnkGrouped)]);
    for(const id of touchedIds){
      const obj = byId[id];
      if(!obj || obj.type!=='pe' || !obj.calc) continue;
      obj.updatedAt = new Date().toISOString();
      await storageSave(STORE_PREFIX, obj);
    }
  }

  return { created, updated };
}

function renderExcelBox(){
  const statusEl = document.getElementById('excelStatus');
  const actionsEl = document.getElementById('excelActions');
  if(!statusEl || !actionsEl) return;
  const hasFsApi = typeof window.showSaveFilePicker === 'function';

  if(EXCEL_STATE.handle){
    statusEl.classList.add('linked');
    if(!statusEl.textContent || statusEl.textContent==='Keine Datei verknüpft'){
      statusEl.textContent = `Verknüpft: ${EXCEL_STATE.fileName}`;
    }
  } else if(EXCEL_STATE.needsPermission){
    statusEl.classList.remove('linked');
    statusEl.textContent = `"${EXCEL_STATE.fileName}" verknüpft – Zugriff erneut bestätigen`;
  } else {
    statusEl.classList.remove('linked');
    statusEl.textContent = hasFsApi ? 'Keine Datei verknüpft' : 'Auto-Sync in diesem Browser nicht verfügbar';
  }

  actionsEl.innerHTML = `
    ${EXCEL_STATE.needsPermission ? `<button id="excelConfirmBtn" class="primary-ish">Zugriff bestätigen</button>` : ''}
    ${hasFsApi ? `<button id="excelLinkBtn" class="${(EXCEL_STATE.handle||EXCEL_STATE.needsPermission)?'':'primary-ish'}">${EXCEL_STATE.handle?'Andere Datei verknüpfen':'Excel-Datei verknüpfen'}</button>` : ''}
    <button id="excelExportBtn">Als Excel exportieren</button>
    <label for="excelImportInput">Excel importieren</label>
    <input type="file" id="excelImportInput" accept=".xlsx,.xls" style="display:none;" />
  `;
  const confirmBtn = document.getElementById('excelConfirmBtn');
  if(confirmBtn) confirmBtn.addEventListener('click', excelConfirmPermission);
  const linkBtn = document.getElementById('excelLinkBtn');
  if(linkBtn) linkBtn.addEventListener('click', excelLinkFile);
  document.getElementById('excelExportBtn').addEventListener('click', excelDownloadExport);
  document.getElementById('excelImportInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) excelImportFromFile(file);
    e.target.value = '';
  });
}


/* ==================== BOOTSTRAP ==================== */
document.getElementById('nav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.nav-item');
  if(!btn) return;
  if(MODAL.map){ MODAL.map.remove(); MODAL.map = null; }
  if(KARTE_VIEW.map){ KARTE_VIEW.map.remove(); KARTE_VIEW.map = null; }
  MODAL.objectId = null;
  STATE.view = btn.dataset.view;
  STATE.filters.search = '';
  renderApp();
});
document.getElementById('btnNew').addEventListener('click', openNewObjectFlow);

async function init(){
  STATE.loading = true;
  renderApp();
  renderExcelBox();
  const [objects, contacts] = await Promise.all([storageList(STORE_PREFIX), storageList(CONTACT_PREFIX)]);
  STATE.objects = objects;
  STATE.contacts = contacts;
  STATE.loading = false;
  renderApp();
  // Erst NACHDEM STATE.objects mit den echten gespeicherten Objekten befüllt ist,
  // die verknüpfte Excel-Datei einlesen (siehe Kommentar bei excelApplyWorkbook).
  await excelTryRestoreHandle();
  renderApp();
}
init();
</script>
</body>
